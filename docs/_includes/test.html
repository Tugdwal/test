<p>
    {{ site.pages }}
    {% assign segments = page.dir | split: '/' %}
    <a href="{{ site.baseurl }}">Home</a>
    "{{ segments | join: '", "' }}"
    {% for segment in segments offset: 1 %}
    {% assign crumb = site.data.test[segment] %}
    &gt; <a href="{{ crumb.url | prepend: site.baseurl }}">{{ crumb.title }}</a>
    {% endfor %}
    &gt; {{ page.title }}
</p>
